<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Shield icon (large, centered) -->
  <g transform="translate(440, 130) scale(4)">
    <path d="M 16 1 L 25 4 L 25 13 Q 25 19 16 26 Q 7 19 7 13 L 7 4 Z" fill="#f59e0b"/>
    <path d="M 11.5 14 L 14.5 17 L 20.5 11" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Amber line divider -->
  <rect x="250" y="300" width="700" height="3" rx="1.5" fill="url(#amberLine)"/>

  <!-- Wordmark -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="88" fill="#f59e0b" letter-spacing="-1">SteelProof</text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="400" fill="#cbd5e1">AI Startup Idea Stress-Test</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="300" fill="#64748b">steelproof.ctonew.app</text>
</svg>
